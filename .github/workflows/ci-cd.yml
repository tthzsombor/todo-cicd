name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker:
    name: Docker image build & push
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy (Render) és smoke test
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy hook meghívása
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Smoke test – vár, amíg az app elindul
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ secrets.APP_URL }}/health" | grep -q '"status":"ok"'; then
              echo "Az alkalmazás elérhető."; exit 0
            fi
            echo "Próbálkozás $i/30..."; sleep 10
          done
          echo "Az alkalmazás nem indult el időben"; exit 1
